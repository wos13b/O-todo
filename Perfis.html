    <script src="Anim.js" defer></script>

    <title>O todo - Perfis</title>
</head>
<body>

    <div class="header">
        <button class="menu-toggle">☰</button>

            <li><a href="Idiom.html">Idioma</a></li>

            <li id="nav-cadastro"><a href="Cdstr.html">Cadastro</a></li>
        </ul>
        <div class="Log_perf"></div>
    </div>

    <div class="Main">
        <div class="Conteudo">
            <h1>Perfis da Família</h1>
            <p>Membros registrados no sistema:</p>

            <div class="user-profiles-container" id="userProfilesContainer">
                <p style="color: #aaa; text-align: center; width: 100%;">A carregar perfis...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("userProfilesContainer");
            if (!container) return;

            try {
                const { data: users, error } = await supabaseClient
                    .from('profiles') 
                    .select('*');

                if (error) throw error;

                container.innerHTML = "";

                if (!users || users.length === 0) {
                    container.innerHTML = "<p>Nenhum perfil encontrado.</p>";
                    return;
                }

                users.forEach(user => {
                    const userId = user.id || user.user_id;
                    const userName = user.nome || user.name || "Membro";
                    const userAvatar = user.avatar_url || user.foto || "ico/Logo.png";

                    const card = document.createElement("a");
                    card.href = `Perf.html?id=${userId}`;
                    card.className = "user-circle-card";

                    card.innerHTML = `
                        <div class="user-avatar">
                            <img src="${userAvatar}" alt="${userName}" onerror="this.src='ico/Logo.png'">
                        </div>
                        <span class="user-name">${userName}</span>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Erro ao carregar os perfis:", err);
                container.innerHTML = "<p>Erro ao carregar os perfis do banco de dados.</p>";
            }
        });
    </script>
</body>
</html>
