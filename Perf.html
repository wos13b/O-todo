<div class="Conteudo">

    <div class="Perfil_area">

        <div class="Perfil_cabecalho">

            <div class="Perfil_imagem">
                <img
                    id="perfil-imagem"
                    src="img/Logo.png"
                    alt="Imagem de perfil"
                >
            </div>

            <div class="Perfil_dados">

                <h1 id="perfil-nome">
                    Usuário
                </h1>

                <p id="perfil-nickname">
                    @nickname
                </p>

                <p id="perfil-email">
                    email@email.com
                </p>

            </div>

        </div>


        <div class="Perfil_info">

            <h2>Informações do perfil</h2>

            <p>
                <strong>Nome:</strong>
                <span id="info-nome">---</span>
            </p>

            <p>
                <strong>Nickname:</strong>
                <span id="info-nickname">---</span>
            </p>

            <p>
                <strong>E-mail:</strong>
                <span id="info-email">---</span>
            </p>

            <p>
                <strong>ID:</strong>
                <span id="info-id">---</span>
            </p>

        </div>

    </div>

</div>
